# Keys allowed to encrypt/decrypt secrets/secrets.yaml
#
# mig (your personal edit key — run once, never commit the private part):
#   nix-shell -p age -c age-keygen -o ~/.config/sops/age/keys.txt
#
# Per machine (as root): convert the SSH host key to an age public key:
#   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
keys:
  - &mig age1mkg249qmqegz4g9mf0z4224tfqyxvnn04p7xuy7wlnrlaqda8auspnrqk7
  - &laptop age176ump6gcp7j8vv9p9msq57lfne2dse4flcgyzws8hzxvc4zh998swur57n
  - &server age15p7vfxsyr3khzee5u3250xxckwquqruyaz68l6y94kq8er24hfksenvw7z
# TODO: uncomment once the machine exists (as root:
  #   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub), then re-encrypt
  #   (sops updatekeys secrets/secrets.yaml) so it can decrypt:
  # - &desktop age1...

creation_rules:
  - path_regex: ^secrets/.*\.yaml$
    key_groups:
      - age:
          - *mig
          - *laptop
          - *server
        # - *desktop
